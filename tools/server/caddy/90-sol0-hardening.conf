# Sol-0: confinement of Caddy, the only program that reads requests from the Internet (SEC-09, SERVER-03), and its CPU
# share (SEC-24: the engine first). Installed by install.sh into /etc/systemd/system/caddy.service.d/.
# Caddy writes only its certificates and autosave under its home /var/lib/caddy. Not tried on the server before Lot 2:
# after the restart check `systemctl is-active caddy`, `systemd-analyze security caddy`, `journalctl -u caddy`
# (no write error), then a month before the certificate expiry that the renewal still works.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CPUWeight=100
