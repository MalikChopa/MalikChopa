# Sol-0: key-only SSH (installed only if authorized_keys is not empty and sshd -t passes)
# First value wins in sshd: this file is read before 50-cloud-init.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
# root stays allowed until the owner switches (SEC-03); sol0ops = read-only report (forced command sol0-status)
AllowUsers root sol0ops
