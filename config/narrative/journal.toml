id = "first.breakdown"
slot = "extra"
prio = 4
replaces = ["drama.breakdown1", "drama.breakdowns"]
when = ["firsts:first.breakdown"]
needs = ["breakdowns"]
fr = ["C'est ma première panne : la batterie est passée sous {cutoff_pct} %."]
en = ["This is my first breakdown: the battery fell below {cutoff_pct}%."]

[[line]]
id = "first.night_drive"
slot = "extra"
prio = 4
when = ["firsts:first.night_drive"]
needs = ["night_drive_ticks"]
fr = ["J'ai roulé de nuit pour la première fois : {night_drive_ticks} pas de temps."]
en = ["I drove at night for the first time: {night_drive_ticks} time steps."]

[[line]]
id = "first.stuck"
slot = "extra"
prio = 4
replaces = ["drama.stuck", "drama.freed_by_reverse"]
when = ["firsts:first.stuck", "stuck"]
needs = ["stuck"]
fr = ["Pour la première fois, je termine le sol ensablé."]
en = ["For the first time, I finish the sol stuck in sand."]

[[line]]
id = "first.stuck.freed"
slot = "extra"
prio = 4
replaces = ["drama.stuck", "drama.freed_by_reverse"]
when = ["firsts:first.stuck", "freed_by=reverse"]
needs = ["freed_by"]
fr = ["Pour la première fois, je me suis ensablé puis dégagé seul en marche arrière."]
en = ["For the first time, I got stuck in sand and freed myself by reversing."]

[[line]]
id = "first.sample"
slot = "extra"
prio = 4
when = ["firsts:first.sample"]
needs = ["samples"]
fr = ["Premier forage : j'ai prélevé un échantillon."]
en = ["First drilling: I took a sample."]

[[line]]
id = "first.spectrum"
slot = "extra"
prio = 4
when = ["firsts:first.spectrum"]
needs = ["spectra"]
fr = ["Premier spectre mesuré."]
en = ["First spectrum measured."]

[[line]]
id = "first.category"
slot = "extra"
prio = 4
when = ["firsts:first.category", "new_names"]
needs = ["new_names", "n_categories"]
fr = ["Première catégorie reconnue ; je l'ai nommée {new_name}."]
en = ["First category recognised; I named it {new_name}."]

[[line]]
id = "first.anomaly"
slot = "extra"
prio = 4
replaces = ["event.anomaly"]
when = ["firsts:first.anomaly"]
needs = ["anomaly_seen"]
fr = ["J'ai vu une anomalie pour la première fois : une structure que mes cartes ne contenaient pas."]
en = ["I saw an anomaly for the first time: a structure that my maps did not contain."]

# ---------------------------------------------------------------- extras: comparison of the last sample (prio 5, stage 4)
[[line]]
id = "learn.s4.novel"
slot = "extra"
prio = 5
when = ["samples>=1", "novel_vs_prev>=1"]
needs = ["novel_vs_prev"]
fr = ["Le dernier échantillon diffère de {novel_vs_prev} des échantillons précédents avec lesquels je l'ai comparé."]
en = ["The latest sample differs from {novel_vs_prev} of the earlier samples it was compared with."]

[[line]]
id = "learn.s4.same"
slot = "extra"
prio = 5
when = ["samples>=1", "novel_vs_prev==0"]
needs = ["novel_vs_prev"]
fr = ["Le dernier échantillon ne diffère d'aucun des échantillons précédents avec lesquels je l'ai comparé."]
en = ["The latest sample is not different from any of the earlier samples it was compared with."]

# ---------------------------------------------------------------- extras: safe mode (prio 5)
[[line]]
id = "safe.freed"
slot = "extra"
prio = 5
when = ["safe_actions:freed"]
needs = ["safe_actions"]
fr = ["Je finissais le sol précédent ensablé. Le mode sûr m'a dégagé en me faisant reculer d'une cellule."]
en = ["I ended the previous sol stuck in sand. Safe mode freed me by moving me back one cell."]

[[line]]
id = "safe.righted"
slot = "extra"
prio = 5
when = ["safe_actions:righted"]
needs = ["safe_actions"]
fr = ["Je finissais le sol précédent basculé. Le mode sûr m'a redressé ; ma batterie a perdu {tip_cost_pct} %."]
en = ["I ended the previous sol tipped over. Safe mode righted me; my battery lost {tip_cost_pct}%."]

[[line]]
id = "safe.recharged"
slot = "extra"
prio = 5
when = ["safe_actions:recharged"]
needs = ["safe_actions"]
fr = ["Ma batterie est restée sous le seuil de panne pendant tout un sol. Une recharge de secours m'a ramené à {safe_recharge_pct} %."]
en = ["My battery stayed below the breakdown threshold for a whole sol. An emergency recharge brought me back to {safe_recharge_pct}%."]

[[line]]
id = "safe.noise_doubled"
slot = "extra"
prio = 5
when = ["safe_actions:noise_doubled"]
needs = ["safe_actions"]
fr = ["Pendant {no_progress_sols} sols de suite, j'ai parcouru moins de {no_progress_cells} cellules éveillé. Le mode sûr a doublé mon bruit d'exploration pour un sol."]
en = ["For {no_progress_sols} sols in a row, I covered fewer than {no_progress_cells} cells while awake. Safe mode doubled my exploration noise for one sol."]

# ---------------------------------------------------------------- extras: world events (prio 6)
[[line]]
id = "event.storm"
slot = "extra"
prio = 6
when = ["events:storm"]
needs = ["events"]
fr = ["Une tempête de poussière a réduit ma vue de {storm_view_pct} %."]
en = ["A dust storm cut my view by {storm_view_pct}%."]

[[line]]
id = "event.deposit"
slot = "extra"
prio = 6
when = ["events:deposit"]
needs = ["events"]
fr = ["Un gisement de substance rare est apparu dans le monde."]
en = ["A deposit of a rare substance appeared in the world."]

[[line]]
id = "event.anomaly"
slot = "extra"
prio = 6
when = ["events:anomaly", "!anomaly_seen"]
needs = ["events"]
fr = ["Une structure inhabituelle est apparue dans le monde. Je ne l'ai pas encore vue."]
en = ["An unusual structure appeared in the world. I have not seen it yet."]

[[line]]
id = "event.impact"
slot = "extra"
prio = 6
when = ["events:impact"]
needs = ["events"]
fr = ["Un impact de comète a creusé un cratère ; j'ai ressenti la secousse."]
en = ["A comet impact dug a crater; I felt the shock."]

# ---------------------------------------------------------------- extras: dramas (prio 7)
[[line]]
id = "drama.stuck"
slot = "extra"
prio = 7
when = ["stuck"]
needs = ["stuck"]
fr = ["Je termine le sol ensablé."]
en = ["I finish the sol stuck in sand."]

[[line]]
id = "drama.freed_by_reverse"
slot = "extra"
prio = 7
when = ["freed_by=reverse"]
needs = ["freed_by"]
fr = ["Ensablé, je me suis dégagé seul en marche arrière."]
en = ["Stuck in sand, I freed myself by reversing."]

[[line]]
id = "drama.tipped"
slot = "extra"
prio = 7
when = ["tipped"]
needs = ["tipped", "max_tilt_deg"]
fr = ["J'ai basculé : l'inclinaison a atteint {max_tilt_deg:0}°."]
en = ["I tipped over: the tilt reached {max_tilt_deg:0}°."]

[[line]]
id = "drama.breakdown1"
slot = "extra"
prio = 7
when = ["breakdowns==1", "stage!=3"]
needs = ["breakdowns", "forced_sleep_ticks"]
fr = ["Une panne de batterie : {forced_sleep_ticks} pas de temps de veille forcée."]
en = ["One battery breakdown: {forced_sleep_ticks} time steps of forced standby."]

[[line]]
id = "drama.breakdowns"
slot = "extra"
prio = 7
when = ["breakdowns>1", "stage!=3"]
needs = ["breakdowns", "forced_sleep_ticks"]
fr = ["{breakdowns} pannes de batterie : {forced_sleep_ticks} pas de temps de veille forcée."]
en = ["{breakdowns} battery breakdowns: {forced_sleep_ticks} time steps of forced standby."]

[[line]]
id = "slip.worst"
slot = "extra"
prio = 7
skip_repeat = true
window = 4
when = ["stage>=2"]
needs = ["slip_worst_terrain"]
fr = ["J'ai surtout glissé sur {slip_worst_terrain}.",
      "C'est sur {slip_worst_terrain} que mes roues ont le plus glissé.",
      "Mes roues ont glissé surtout sur {slip_worst_terrain}."]
en = ["I slipped most on {slip_worst_terrain}.",
      "My wheels slipped most on {slip_worst_terrain}.",
      "The terrain where my wheels slid the most was {slip_worst_terrain}."]

# ---------------------------------------------------------------- extras: health, contact gap (prio 8-9)
[[line]]
id = "health.truncated"
slot = "extra"
prio = 8
when = ["truncated_at"]
needs = ["truncated_at"]
fr = ["Mon apprentissage de {truncated_module} s'est arrêté à la génération {truncated_gen} : le temps de calcul alloué était atteint."]
en = ["My learning of {truncated_module} stopped at generation {truncated_gen}: the allotted compute time was reached."]

[[line]]
id = "health.degraded"
slot = "extra"
prio = 8
when = ["degraded"]
needs = ["degraded"]
fr = ["Un calcul a échoué ; mon apprentissage est suspendu pour ce sol."]
en = ["A computation failed; my learning is suspended for this sol."]

[[line]]
id = "gap"
slot = "extra"
prio = 9
when = ["days_since_last_run>=2"]
needs = ["days_since_last_run"]
fr = ["Mon dernier contact date de {days_since_last_run} jours."]
en = ["My last contact was {days_since_last_run} days ago."]

# ================================================================ daily digest (LIVE-DESIGN 6, narrative/digest.py)
# [[day]] : one line of the daily entry, in file order; prio : the largest prio is dropped first when the entry exceeds 900
# characters. stage = tones (0-1 naive, 2-4 technical, 5 scientific); when/needs as above, evaluated on the day markers
# (digest._markers: the accumulator's integers plus km, r2_pct, ari_pct, reached, ev_*, safe_*, fits, missed_total...).
[[day]]
id = "day.summary.n"
prio = 0
stage = [0, 1]
when = ["fits>0"]
needs = ["km"]
fr = ["Le {date}, j'ai vécu {sols} sol(s) : {km} km parcourus, {targets} cible(s) atteinte(s).",
      "Le {date} : {sols} sol(s) derrière moi, {km} km de chemin, {targets} cible(s) atteinte(s)."]
en = ["On {date} I lived {sols} sol(s): {km} km driven, {targets} target(s) reached.",
      "{date}: {sols} sol(s) behind me, {km} km of road, {targets} target(s) reached."]

[[day]]
id = "day.summary.t"
prio = 0
stage = [2, 3, 4]
when = ["fits>0"]
needs = ["km"]
fr = ["Le {date}, {sols} sol(s) (n° {first_sol} à {last_sol}) : {km} km, {targets} cible(s) atteinte(s), {breakdowns} panne(s) de batterie.",
      "Bilan du {date} : {sols} sol(s), {km} km parcourus, {targets} cible(s), {breakdowns} panne(s)."]
en = ["On {date}, {sols} sol(s) (no. {first_sol} to {last_sol}): {km} km, {targets} target(s) reached, {breakdowns} battery breakdown(s).",
      "Summary of {date}: {sols} sol(s), {km} km driven, {targets} target(s), {breakdowns} breakdown(s)."]

[[day]]
id = "day.summary.s"
prio = 0
stage = [5]
when = ["fits>0"]
needs = ["km"]
fr = ["{date} : {sols} sol(s) (n° {first_sol} à {last_sol}), {km} km, {targets} cible(s), {breakdowns} panne(s), {samples} prélèvement(s).",
      "Journée du {date} : {sols} sol(s), {km} km, {targets} cible(s) atteinte(s), {samples} prélèvement(s), {spectra} spectre(s)."]
en = ["{date}: {sols} sol(s) (no. {first_sol} to {last_sol}), {km} km, {targets} target(s), {breakdowns} breakdown(s), {samples} sample(s).",
      "Day {date}: {sols} sol(s), {km} km, {targets} target(s) reached, {samples} sample(s), {spectra} spectrum/spectra."]

[[day]]
id = "day.summary.passive"
prio = 0
when = ["fits==0"]
fr = ["Le {date}, je suis resté en veille pendant les {sols} sol(s) : incident technique."]
en = ["On {date} I stayed on standby for all {sols} sol(s): technical incident."]

[[day]]
id = "day.progress"
prio = 1
when = ["fits>0", "reached==0"]
fr = ["Ma progression vers le stade suivant est passée de {prog0_pct} % à {prog1_pct} %.",
      "Vers le stade suivant : {prog0_pct} % au début de la journée, {prog1_pct} % à la fin."]
en = ["My progress towards the next stage went from {prog0_pct}% to {prog1_pct}%.",
      "Towards the next stage: {prog0_pct}% at the start of the day, {prog1_pct}% at the end."]

[[day]]
id = "day.progress.reached"
prio = 1
when = ["fits>0", "reached==1"]
fr = ["Le critère du stade suivant est atteint ; j'attends la fin de la durée minimale du stade : encore {remaining_d} j {remaining_h} h."]
en = ["The criterion of the next stage is reached; I am waiting for the end of the stage's minimum duration: {remaining_d} d {remaining_h} h left."]

[[day]]
id = "day.outage"
prio = 1
when = ["missed_total>=1"]
fr = ["Le serveur a manqué {missed} créneau(x) et rendu {late} sol(s) en retard."]
en = ["The server missed {missed} slot(s) and delivered {late} sol(s) late."]

[[day]]
id = "day.energy"
prio = 3
stage = [2, 3, 4, 5]
when = ["fits>0"]
needs = ["battery_min_pct"]
fr = ["Batterie au plus bas : {battery_min_pct} % ; sols avec un arrêt forcé : {forced_sols}."]
en = ["Lowest battery: {battery_min_pct}%; sols with a forced stop: {forced_sols}."]

[[day]]
id = "day.battery"
prio = 3
stage = [2, 3, 4, 5]
when = ["bat_n>0"]
fr = ["Épreuve de batterie : meilleur score {bat_best}, dernier {bat_last} ({bat_n} mesure(s){restored_note})."]
en = ["Battery test: best score {bat_best}, last {bat_last} ({bat_n} measurement(s){restored_note})."]

[[day]]
id = "day.m1"
prio = 4
stage = [1, 2, 3, 4, 5]
when = ["r2_pct"]
needs = ["r2_pct"]
fr = ["Mon modèle de roues explique {r2_pct} % de ce qui arrive."]
en = ["My wheel model explains {r2_pct}% of what happens."]

[[day]]
id = "day.storms"
prio = 5
when = ["storm_sols>0"]
fr = ["Tempête de poussière sur {storm_sols} sol(s)."]
en = ["Dust storm during {storm_sols} sol(s)."]

[[day]]
id = "day.samples"
prio = 4
stage = [4, 5]
when = ["samples>0"]
fr = ["{samples} prélèvement(s) dont {novel} nouveaux."]
en = ["{samples} sample(s), {novel} of them new."]

[[day]]
id = "day.spectra"
prio = 4
stage = [4, 5]
when = ["spectra>0"]
fr = ["{spectra} spectre(s) analysés."]
en = ["{spectra} spectrum/spectra analysed."]

[[day]]
id = "day.categories"
prio = 4
stage = [5]
when = ["ari_pct"]
needs = ["ari_pct"]
fr = ["Mes catégories s'accordent à {ari_pct} % avec le tirage précédent."]
en = ["My categories agree {ari_pct}% with the previous draw."]

[[day]]
id = "day.safe"
prio = 5
when = ["safe_total>0"]
fr = ["Mode sûr déclenché {safe_total} fois."]
en = ["Safe mode triggered {safe_total} times."]

[[day]]
id = "day.events"
prio = 5
when = ["ev_deposit", "ev_impact"]
fr = ["Un dépôt et un impact ont marqué la journée."]
en = ["A deposit and an impact marked the day."]

[[day]]
id = "day.names"
prio = 2
when = ["n_names>0"]
fr = ["Nouveaux noms : {name_list}."]
en = ["New names: {name_list}."]

[[day]]
id = "day.lock"
prio = 2
when = ["consolidation_on"]
fr = ["J'ai atteint le seuil du stade suivant, mais mon micrologiciel ne le connaît pas encore. J'attends une mise à jour."]
en = ["I reached the threshold of the next stage, but my firmware does not know it yet. I am waiting for an update."]
